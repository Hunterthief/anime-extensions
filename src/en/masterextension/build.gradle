ext {
    extName = 'Master Extension'
    extClass = '.MasterExtension'
    extVersionCode = 5
}

apply plugin: "kei.plugins.extension.legacy"

// 1. Prevents META-INF merge conflicts between different NanoHTTPD versions
android {
    packaging {
        resources {
            pickFirsts += ['META-INF/nanohttpd/mimetypes.properties']
        }
    }
}

// 2. GLOBAL EXCLUDES: This is the hammer. It forcefully blocks the broken 
// komikku-app SNAPSHOT fork and fragmented core JARs from entering the build.
configurations.all {
    exclude group: 'org.nanohttpd', module: 'nanohttpd'
    exclude group: 'org.nanohttpd', module: 'nanohttpd-core'
    exclude group: 'com.github.NanoHttpd.nanohttpd', module: 'nanohttpd'
    exclude group: 'com.github.komikku-app.nanohttpd', module: 'nanohttpd'
}

dependencies {
    implementation(project(':lib:playlistutils'))
    implementation(project(':lib:unpacker'))
    implementation(project(':lib:cloudflareinterceptor'))
    implementation(project(':lib:megacloudextractor'))
    implementation(project(':lib:cryptoaes'))
    implementation(project(":lib:rapidcloudextractor"))
    implementation(project(":lib:gogostreamextractor"))
    implementation(project(':lib:streamwishextractor'))
    implementation(project(':lib:vidmolyextractor'))
    implementation(project(':lib:streamlareextractor'))
    implementation(project(':lib:mp4uploadextractor'))
    implementation(project(':lib:doodextractor'))
    implementation(project(':lib:okruextractor'))
    implementation(project(':lib:filemoonextractor'))
    implementation(project(':lib:m3u8server'))
    implementation(project(':lib-multisrc:anikototheme'))
    
    // 3. THE FIX: Use the official "jar-with-dependencies" from Maven Central.
    // This single JAR contains BOTH 'fi.iki.elonen' (AnimePahe) AND 
    // 'org.nanohttpd.protocols.http' (Anikoto/M3U8Server) without any conflicts.
    implementation("org.nanohttpd:nanohttpd-webserver:2.3.1")
}
